<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CapMoney">

<link rel="manifest" href="manifest.json">

<title>CapMoney</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #111113;
    --surface: #1e1e23;
    --surface2: #29292e;
    --surface3: #303036;

    --text: #f3f1ef;
    --muted: #aaa7a5;
    --muted2: #777579;

    --blue: #70a9e4;
    --blue2: #5d96d4;

    --green: #82d184;
    --green2: #3fa64b;

    --red: #ef7779;
    --yellow: #ffc53d;
    --purple: #936df5;
    --cyan: #50d2d2;

    --radius: 28px;
    --nav-height: 92px;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
}

body {
    min-height: 100vh;
    padding-bottom: calc(var(--nav-height) + 30px);
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    border: 0;
    color: inherit;
    cursor: pointer;
}

input,
select,
textarea {
    width: 100%;
    border: 0;
    outline: none;
    color: var(--text);
    background: var(--surface2);
    border-radius: 16px;
    padding: 15px 16px;
}

textarea {
    resize: vertical;
}

.hidden {
    display: none !important;
}

.app {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding:
        env(safe-area-inset-top)
        20px
        20px;
}

/* ---------------- HEADER ---------------- */

.top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 25px 5px 15px;
}

.greeting {
    color: var(--muted);
    font-size: 22px;
    margin-bottom: 6px;
}

.user-name {
    font-size: 42px;
    font-weight: 750;
    letter-spacing: -1.5px;
}

.avatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #aaa6a2;
    display: grid;
    place-items: center;
    color: #171719;
    font-size: 34px;
}

/* ---------------- COMMON ---------------- */

.section {
    margin-top: 20px;
}

.card {
    background: var(--surface);
    border-radius: var(--radius);
}

.pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface2);
    border-radius: 999px;
    padding: 8px 14px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
}

.blue {
    color: var(--blue);
}

.green {
    color: var(--green);
}

.red {
    color: var(--red);
}

.yellow {
    color: var(--yellow);
}

.muted {
    color: var(--muted);
}

/* ---------------- HOME ---------------- */

.home-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.summary-box {
    padding: 20px;
    min-height: 110px;
    border-radius: 24px;
    background: var(--surface2);
}

.summary-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 25px;
    margin-bottom: 8px;
}

.summary-title {
    color: var(--muted);
    font-size: 15px;
}

.summary-value {
    font-size: 22px;
    font-weight: 750;
    margin-top: 3px;
}

.expense .summary-icon {
    background: var(--red);
}

.income .summary-icon {
    background: var(--green);
}

.home-tabs {
    display: flex;
    gap: 12px;
    margin: 22px 0;
}

.home-tab {
    padding: 13px 20px;
    border-radius: 999px;
    background: var(--surface2);
    color: var(--muted);
    font-weight: 650;
}

.home-tab.active {
    background: var(--blue);
    color: white;
}

.month-selector {
    height: 76px;
    background: var(--surface);
    border-radius: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    margin-bottom: 22px;
}

.month-selector button {
    background: transparent;
    color: var(--blue);
    font-size: 38px;
}

.month-name {
    font-size: 26px;
    font-weight: 750;
}

.calendar {
    background: var(--surface);
    border-radius: 28px;
    padding: 25px 12px 30px;
}

.weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
}

.weekdays {
    color: var(--muted);
    margin-bottom: 22px;
}

.day {
    min-height: 82px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 7px;
    padding-top: 8px;
}

.day-circle {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--surface3);
    display: grid;
    place-items: center;
    color: var(--muted);
}

.day.has-add .day-circle {
    background: transparent;
    border: 2px solid #44444b;
    color: #66666d;
    font-size: 30px;
}

.day.today .day-circle {
    background: var(--blue);
    color: white;
}

.day.today .day-number {
    color: var(--blue);
    font-weight: 800;
}

.day-dot {
    width: 7px;
    height: 7px;
    background: var(--blue);
    border-radius: 50%;
}

.fab {
    position: fixed;
    right: 28px;
    bottom: calc(var(--nav-height) + 28px);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 10px 35px rgba(112,169,228,.35);
    font-size: 42px;
    z-index: 30;
}

/* ---------------- ANALYTICS ---------------- */

.segment {
    display: flex;
    background: var(--surface);
    border-radius: 30px;
    padding: 5px;
}

.segment button {
    flex: 1;
    padding: 15px 10px;
    background: transparent;
    border-radius: 25px;
    color: var(--muted);
    font-weight: 700;
}

.segment button.active {
    background: var(--blue);
    color: white;
}

.analytics-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 22px 0;
}

.analytics-title button {
    background: var(--surface2);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 25px;
}

.period-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 25px 0;
}

.period-nav button {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--surface2);
    color: var(--muted);
    font-size: 30px;
}

.period-title {
    font-size: 26px;
    font-weight: 750;
}

.filter-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.filter-tab {
    padding: 12px 20px;
    border-radius: 999px;
    background: var(--surface2);
    color: var(--muted);
}

.filter-tab.active {
    background: var(--blue);
    color: white;
}

.income-expense {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.money-card {
    padding: 24px;
    border-radius: 24px;
    background: var(--surface);
}

.money-card.active-green {
    border: 2px solid rgba(130,209,132,.5);
}

.money-card.active-red {
    border: 2px solid rgba(239,119,121,.5);
}

.money-card-title {
    color: var(--muted);
}

.money-card-value {
    font-size: 25px;
    font-weight: 800;
    margin-top: 8px;
}

.balance-card {
    padding: 24px;
    margin-top: 18px;
}

.balance-card h3 {
    color: var(--muted);
    margin: 0;
}

.balance {
    color: var(--green);
    font-size: 30px;
    font-weight: 800;
    margin-top: 8px;
}

.chart-card {
    min-height: 430px;
    padding: 20px;
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.empty-state {
    text-align: center;
    color: var(--muted);
}

.empty-icon {
    font-size: 70px;
    opacity: .65;
    margin-bottom: 20px;
}

.empty-title {
    font-size: 28px;
    margin-bottom: 12px;
}

.empty-description {
    font-size: 18px;
}

/* ---------------- ACCOUNTS ---------------- */

.top-sections {
    display: flex;
    background: var(--surface);
    border-radius: 30px;
    padding: 5px;
}

.top-sections button {
    flex: 1;
    background: transparent;
    padding: 16px 5px;
    border-radius: 25px;
    color: var(--muted);
    font-weight: 700;
}

.top-sections button.active {
    background: var(--blue);
    color: white;
}

.total-card {
    margin-top: 28px;
    padding: 32px 25px;
    text-align: center;
}

.total-label {
    color: var(--muted);
    font-size: 20px;
}

.total-number {
    color: var(--green);
    font-size: 64px;
    font-weight: 800;
    margin: 20px 0;
}

.total-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 1px solid #3a3a3e;
    padding-top: 22px;
}

.total-detail strong {
    display: block;
    font-size: 24px;
    margin-top: 8px;
}

.action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin: 28px 0;
}

.action-button {
    min-height: 110px;
    border-radius: 25px;
    background: var(--blue);
    font-size: 24px;
    font-weight: 700;
}

.action-button.green-button {
    background: var(--green);
}

.list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 28px 0 15px;
}

.account-item {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px;
    background: var(--surface);
    border-radius: 25px;
    margin-bottom: 16px;
}

.account-icon {
    width: 65px;
    height: 65px;
    flex-shrink: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--green2);
    font-size: 30px;
}

.account-info {
    flex: 1;
}

.account-name {
    font-size: 22px;
    font-weight: 750;
}

.account-balance {
    color: var(--green);
    font-size: 20px;
    margin-top: 7px;
}

.arrow {
    font-size: 30px;
    color: var(--muted);
}

/* ---------------- EMPTY MODULE ---------------- */

.module-empty {
    min-height: 450px;
    background: var(--surface);
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.module-empty .icon {
    font-size: 90px;
    margin-bottom: 25px;
    opacity: .7;
}

.module-empty h2 {
    margin: 0 0 18px;
    font-size: 30px;
}

.module-empty p {
    color: var(--muted);
    font-size: 20px;
    margin: 0;
}

/* ---------------- BUDGET ---------------- */

.page-title {
    font-size: 32px;
    margin: 22px 0 4px;
}

.page-subtitle {
    color: var(--muted);
    font-size: 19px;
}

.budget-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.circle-add {
    width: 58px;
    height: 58px;
    background: var(--blue);
    border-radius: 50%;
    font-size: 32px;
}

/* ---------------- PROFILE ---------------- */

.profile-card {
    background: var(--surface);
    border-radius: 28px;
    padding: 38px 25px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.profile-avatar {
    width: 140px;
    height: 140px;
    margin: auto;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 70px;
    background:
        linear-gradient(135deg,#49334e,#2f2942);
    border: 5px solid #d77adf;
    box-shadow: 0 0 30px rgba(215,122,223,.25);
}

.profile-name {
    font-size: 30px;
    font-weight: 800;
    margin-top: 20px;
}

.profile-date {
    display: inline-block;
    background: var(--surface2);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 14px;
    margin-top: 10px;
}

.overview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 20px;
}

.overview-card {
    background: var(--surface);
    border-radius: 22px;
    padding: 24px;
}

.overview-card .icon {
    font-size: 25px;
}

.overview-card label {
    display: block;
    color: var(--muted);
    margin: 20px 0 8px;
}

.overview-card strong {
    font-size: 23px;
}

.settings-list {
    background: var(--surface);
    border-radius: 25px;
    overflow: hidden;
    margin-top: 25px;
}

.setting-row {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 72px;
    padding: 0 20px;
    border-bottom: 1px solid #36363b;
}

.setting-row:last-child {
    border-bottom: 0;
}

.setting-icon {
    width: 30px;
    text-align: center;
    color: var(--blue);
    font-size: 22px;
}

.setting-label {
    flex: 1;
    font-size: 18px;
}

.setting-value {
    color: var(--muted);
}

.setting-arrow {
    color: var(--muted);
    font-size: 24px;
}

/* ---------------- PRO ---------------- */

.pro-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.pro-sheet {
    width: 100%;
    max-width: 850px;
    max-height: 94vh;
    overflow-y: auto;
    background: #151518;
    border-radius: 35px 35px 0 0;
    padding: 35px 28px 50px;
}

.pro-close {
    width: 52px;
    height: 52px;
    background: var(--surface2);
    border-radius: 50%;
    float: right;
    font-size: 30px;
}

.pro-hero {
    clear: both;
    text-align: center;
    padding: 15px 10px 30px;
}

.pro-icon {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #4b3822;
    color: var(--yellow);
    font-size: 48px;
    box-shadow: 0 0 35px rgba(255,197,61,.25);
}

.pro-title {
    font-size: 34px;
    font-weight: 800;
    margin: 30px 0 15px;
}

.pro-subtitle {
    color: var(--muted);
    font-size: 19px;
    line-height: 1.45;
}

.pro-list {
    background: var(--surface);
    border-radius: 28px;
    padding: 25px 18px;
}

.pro-list-title {
    color: var(--muted);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 18px;
}

.pro-feature {
    display: grid;
    grid-template-columns: 72px 1fr 30px;
    gap: 15px;
    align-items: start;
    padding: 15px 0;
}

.pro-feature-icon {
    width: 60px;
    height: 60px;
    border-radius: 17px;
    display: grid;
    place-items: center;
    font-size: 28px;
    background: var(--surface2);
}

.pro-feature-title {
    font-size: 20px;
    font-weight: 750;
    margin-bottom: 6px;
}

.pro-feature-description {
    color: var(--muted);
    font-size: 17px;
    line-height: 1.35;
}

.pro-check {
    color: var(--green);
    font-size: 28px;
    padding-top: 10px;
}

.pro-upgrade {
    width: 100%;
    margin-top: 25px;
    padding: 18px;
    border-radius: 18px;
    background: linear-gradient(135deg,#ffd42f,#ff9828);
    color: #151515;
    font-size: 21px;
    font-weight: 800;
}

/* ---------------- MODAL ---------------- */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 80;
    display: flex;
    align-items: flex-end;
}

.sheet {
    width: 100%;
    max-width: 850px;
    max-height: 90vh;
    overflow-y: auto;
    background: #19191d;
    border-radius: 32px 32px 0 0;
    padding: 25px;
    margin: auto auto 0;
}

.sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.sheet-header h2 {
    margin: 0;
    font-size: 27px;
}

.close {
    width: 45px;
    height: 45px;
    background: var(--surface2);
    border-radius: 50%;
    font-size: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    color: var(--muted);
    margin-bottom: 8px;
}

.form-submit {
    width: 100%;
    padding: 17px;
    background: var(--blue);
    border-radius: 17px;
    font-size: 19px;
    font-weight: 750;
}

/* ---------------- NAV ---------------- */

.bottom-nav {
    position: fixed;
    z-index: 50;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 810px;
    height: var(--nav-height);
    border-radius: 45px;
    background: rgba(55,55,59,.94);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 10px 35px rgba(0,0,0,.35);
    display: grid;
    grid-template-columns: repeat(5,1fr);
    align-items: center;
    padding: 5px;
    backdrop-filter: blur(20px);
}

.nav-button {
    height: 80px;
    border-radius: 40px;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    color: white;
    font-size: 30px;
}

.nav-button span {
    font-size: 12px;
    display: none;
}

.nav-button.active {
    background: #18181b;
    color: var(--blue);
}

/* ---------------- TOAST ---------------- */

.toast {
    position: fixed;
    z-index: 200;
    left: 50%;
    bottom: 120px;
    transform: translateX(-50%);
    background: #29292e;
    border: 1px solid #45454a;
    border-radius: 999px;
    padding: 13px 20px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
}

.toast.show {
    opacity: 1;
}

/* ---------------- RESPONSIVE ---------------- */

@media (min-width: 700px) {
    .app {
        padding-left: 30px;
        padding-right: 30px;
    }

    .bottom-nav {
        width: 760px;
    }

    .pro-sheet,
    .sheet {
        border-radius: 32px;
        margin-bottom: 20px;
    }

    .modal,
    .pro-modal {
        align-items: center;
    }
}

@media (max-width: 430px) {
    .user-name {
        font-size: 36px;
    }

    .month-name {
        font-size: 22px;
    }

    .day-circle {
        width: 52px;
        height: 52px;
    }

    .day {
        min-height: 75px;
    }

    .bottom-nav {
        width: calc(100% - 24px);
    }

    .nav-button {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <button class="nav-button active" data-page="home">
        🏠
    </button>

    <button class="nav-button" data-page="analytics">
        ◔
    </button>

    <button class="nav-button" data-page="accounts">
        ▣
    </button>

    <button class="nav-button" data-page="budget">
        ▤
    </button>

    <button class="nav-button" data-page="profile">
        ●
    </button>

</nav>

<button class="fab hidden" id="fab">+</button>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   CAPMONEY PWA
   ========================================================= */

const STORAGE_KEY = "capmoney_data_v1";

const defaultData = {
    profile: {
        name: "Nos",
        currency: "VND",
        language: "Tiếng Việt",
        theme: "Tối"
    },

    accounts: [
        {
            id: crypto.randomUUID(),
            name: "Wallet",
            type: "wallet",
            balance: 0,
            favorite: true
        },
        {
            id: crypto.randomUUID(),
            name: "Bank",
            type: "bank",
            balance: 0,
            favorite: false
        }
    ],

    transactions: [],

    loans: [],

    investments: [],

    budgets: [],

    friends: [],

    groups: [],

    recurring: [],

    sharedTransactions: []
};

let data = loadData();

let state = {
    page: "home",
    homeMonth: new Date(),
    analyticsPeriod: "month",
    analyticsMonth: new Date(),
    analyticsFilter: "all",
    accountSection: "accounts"
};

/* =========================================================
   STORAGE
   ========================================================= */

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
            return structuredClone(defaultData);
        }

        return {
            ...structuredClone(defaultData),
            ...JSON.parse(raw)
        };

    } catch (e) {
        console.error(e);
        return structuredClone(defaultData);
    }
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

/* =========================================================
   HELPERS
   ========================================================= */

function money(value) {
    value = Number(value || 0);

    return new Intl.NumberFormat("vi-VN", {
        maximumFractionDigits: 0
    }).format(value) + "đ";
}

function dateKey(date) {
    const d = new Date(date);

    return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
    ].join("-");
}

function monthName(date) {
    return `tháng ${date.getMonth() + 1} ${date.getFullYear()}`;
}

function currentMonthTransactions(date) {
    return data.transactions.filter(t => {
        const d = new Date(t.date);

        return d.getMonth() === date.getMonth()
            && d.getFullYear() === date.getFullYear();
    });
}

function totalIncome(transactions = data.transactions) {
    return transactions
        .filter(t => t.type === "income")
        .reduce((s,t) => s + Number(t.amount), 0);
}

function totalExpense(transactions = data.transactions) {
    return transactions
        .filter(t => t.type === "expense")
        .reduce((s,t) => s + Number(t.amount), 0);
}

function totalBalance() {
    return data.accounts.reduce(
        (sum, account) => sum + Number(account.balance || 0),
        0
    );
}

function showToast(text) {
    const el = document.getElementById("toast");

    el.textContent = text;
    el.classList.add("show");

    setTimeout(() => {
        el.classList.remove("show");
    }, 2200);
}

function escapeHTML(str) {
    return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function render() {

    const app = document.getElementById("app");

    switch(state.page) {

        case "home":
            app.innerHTML = renderHome();
            break;

        case "analytics":
            app.innerHTML = renderAnalytics();
            break;

        case "accounts":

            break;

        case "budget":
            app.innerHTML = renderBudget();
            break;

        case "profile":
            app.innerHTML = renderProfile();
            break;
    }

    updateNavigation();
    attachEvents();
}

function updateNavigation() {

    document.querySelectorAll(".nav-button").forEach(btn => {

        btn.classList.toggle(
            "active",
            btn.dataset.page === state.page
        );

    });

    const fab = document.getElementById("fab");

    if (
        state.page === "home" ||
        state.page === "budget" ||
        state.page === "accounts"
    ) {
        fab.classList.remove("hidden");
    } else {
        fab.classList.add("hidden");
    }
}

function renderCalendar(date) {

    const year = date.getFullYear();
    const month = date.getMonth();

    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);

    let start = first.getDay();

    // Việt Nam: T2 -> CN
    start = start === 0 ? 6 : start - 1;

    const days = [];

    for(let i=0; i<start; i++) {
        days.push(`<div class="day"></div>`);
    }

    const today = new Date();

    for(let d=1; d<=last.getDate(); d++) {

        const current = new Date(year, month, d);

        const hasTransaction =
            data.transactions.some(
                t => dateKey(t.date) === dateKey(current)
            );

        const isToday =
            dateKey(today) === dateKey(current);

        days.push(`
            <button
                class="day ${isToday ? "today" : ""}"
                onclick="openTransactionModal('${dateKey(current)}')"
            >

                <div class="day-circle ${
                    hasTransaction ? "" : "has-add"
                }">

                    ${hasTransaction ? "•" : "+"}

                </div>

                <div class="day-number">
                    ${d}
                </div>

                ${
                    hasTransaction
                    ? `<div class="day-dot"></div>`
                    : ""
                }

            </button>
        `);
    }

    return `
    <div class="calendar">

        <div class="weekdays">
            <div>T2</div>
            <div>T3</div>
            <div>T4</div>
            <div>T5</div>
            <div>T6</div>
            <div>T7</div>
            <div>CN</div>
        </div>

        <div class="calendar-grid">
            ${days.join("")}
        </div>

    </div>
    `;
}

function renderCategoryChart(tx) {

    if(!tx.length) {

        return `
        <div class="chart-card card">

            <div class="empty-state">

                <div class="empty-icon">
                    ▥
                </div>

                <div class="empty-title">
                    Chưa có dữ liệu
                </div>

            </div>

        </div>
        `;
    }

    const categories = {};

    tx.forEach(t => {

        if(t.type !== "expense") return;

        categories[t.category] =
            (categories[t.category] || 0)
            + Number(t.amount);

    });

    const rows = Object.entries(categories);

    return `
    <div class="chart-card card"
         style="display:block;min-height:auto">

        <h3>Chi tiêu theo danh mục</h3>

        ${rows.map(([category,value]) => {

            const max =
                Math.max(...rows.map(x => x[1]));

            const width =
                max ? value / max * 100 : 0;

            return `
            <div style="margin:20px 0">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    margin-bottom:8px">

                    <span>${escapeHTML(category)}</span>

                    <strong>${money(value)}</strong>

                </div>

                <div style="
                    height:12px;
                    background:#303036;
                    border-radius:99px;
                    overflow:hidden">

                    <div style="
                        width:${width}%;
                        height:100%;
                        background:var(--blue);
                        border-radius:99px">
                    </div>

                </div>

            </div>
            `;

        }).join("")}

    </div>
    `;
}

function saveTransaction(event) {

    event.preventDefault();

    const type =
        document.getElementById("transactionType").value;

    const amount =
        Number(
            document.getElementById("transactionAmount").value
        );

    const title =
        document.getElementById("transactionTitle").value;

    const category =
        document.getElementById("transactionCategory").value;

    const accountId =
        document.getElementById("transactionAccount").value;

    const date =
        document.getElementById("transactionDate").value;

    const transaction = {
        id: crypto.randomUUID(),
        type,
        amount,
        title,
        category,
        accountId,
        date
    };

    data.transactions.push(transaction);

    const account =
        data.accounts.find(a => a.id === accountId);

    if(account) {

        if(type === "income") {
            account.balance += amount;
        } else {
            account.balance -= amount;
        }

    }

    saveData();
    closeModal();
    render();

    showToast("Đã lưu giao dịch");
}

function openTransferModal() {

    if(data.accounts.length < 2) {
        showToast("Cần ít nhất 2 tài khoản");
        return;
    }

    document.getElementById("modalRoot").innerHTML = `

    <div class="modal">

        <div class="sheet">

                <button class="close"

                    <label>Từ tài khoản</label>

                    <select id="fromAccount">

                        ${
                            data.accounts.map(a => `
                                <option value="${a.id}">
                                    ${escapeHTML(a.name)}
                                </option>
                            `).join("")
                        }

                    </select>

                </div>

                <div class="form-group">

                    <label>Đến tài khoản</label>

                    <select id="toAccount">

                        ${
                            data.accounts.map(a => `
                                <option value="${a.id}">
                                    ${escapeHTML(a.name)}
                                </option>
                            `).join("")
                        }

                    </select>

                </div>

                <div class="form-group">

                    <label>Số tiền</label>

                    <input
                        id="transferAmount"
                        type="number"
                        min="1"
                        required>

                </div>

                <button class="form-submit">
                    Chuyển tiền
                </button>

            </form>

        </div>

    </div>
    `;
}

function saveTransfer(event) {

    event.preventDefault();

    const from =
        document.getElementById("fromAccount").value;

    const to =
        document.getElementById("toAccount").value;

    const amount =
        Number(
            document.getElementById("transferAmount").value
        );

    if(from === to) {
        showToast("Không thể chuyển cùng tài khoản");
        return;
    }

    const fromAccount =
        data.accounts.find(a => a.id === from);

    const toAccount =
        data.accounts.find(a => a.id === to);

    if(!fromAccount || !toAccount) return;

    fromAccount.balance -= amount;
    toAccount.balance += amount;

    data.transactions.push({

        id: crypto.randomUUID(),

        type: "transfer",

        amount,

        title: `Chuyển từ ${fromAccount.name} sang ${toAccount.name}`,

        category: "Chuyển tiền",

        accountId: from,

        date: dateKey(new Date())

    });

    saveData();
    closeModal();
    render();

    showToast("Chuyển tiền thành công");
}

function exportJSON() {

    const blob =
        new Blob(
            [JSON.stringify(data,null,2)],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "capmoney-backup.json";
    a.click();

    URL.revokeObjectURL(url);

    showToast("Đã xuất dữ liệu");
}

function resetData() {

    if(!confirm("Xóa toàn bộ dữ liệu CapMoney?")) {
        return;
    }

    localStorage.removeItem(STORAGE_KEY);

    data = structuredClone(defaultData);

    closeModal();
    render();

    showToast("Đã xóa dữ liệu");
}

/* =========================================================
   NAVIGATION
   ========================================================= */

function attachEvents() {

    document.querySelectorAll(".nav-button")
        .forEach(button => {

            button.onclick = () => {

                state.page =
                    button.dataset.page;

                render();

            };

        });

    const fab =
        document.getElementById("fab");

    if(fab) {

        fab.onclick = () => {

            if(state.page === "home") {
                openTransactionModal();
            }

            if(state.page === "accounts") {
                openAccountModal();
            }

            if(state.page === "budget") {
                openBudgetModal();
            }

        };

    }
}

function setAccountSection(section) {

    state.accountSection = section;

    render();
}

function setAnalyticsPeriod(period) {

    state.analyticsPeriod = period;

    render();
}

function setAnalyticsFilter(filter) {

    state.analyticsFilter = filter;

    render();
}

function changeHomeMonth(delta) {

    state.homeMonth =
        new Date(
            state.homeMonth.getFullYear(),
            state.homeMonth.getMonth() + delta,
            1
        );

    render();
}

function changeAnalyticsMonth(delta) {

    state.analyticsMonth =
        new Date(
            state.analyticsMonth.getFullYear(),
            state.analyticsMonth.getMonth() + delta,
            1
        );

    render();
}

function closeModal() {

    document.getElementById("modalRoot").innerHTML = "";
}
