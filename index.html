<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MoneyTrack">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">

  <title>MoneyTrack — Quản lý tài chính</title>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <header class="topbar">
    <div>
      <div class="eyebrow" id="todayLabel"></div>
      <h1>Xin chào, <span id="userName">Bạn</span></h1>
    </div>

    <button class="avatar" id="profileQuick">
      N
    </button>
  </header>


  <!-- MAIN -->
  <main id="screen" class="screen"></main>


  <!-- BOTTOM TAB -->
  <nav class="tabbar">

    <button data-tab="home" class="tab active">
      <span>⌂</span>
      <small>Home</small>
    </button>

    <button data-tab="stats" class="tab">
      <span>◔</span>
      <small>Stats</small>
    </button>

    <button data-tab="accounts" class="tab">
      <span>▣</span>
      <small>Accounts</small>
    </button>

    <button data-tab="budget" class="tab">
      <span>▤</span>
      <small>Budget</small>
    </button>

    <button data-tab="profile" class="tab">
      <span>●</span>
      <small>Profile</small>
    </button>

  </nav>

</div>


<!-- FLOATING ADD BUTTON -->
<button class="fab" id="addBtn">
  ＋
</button>


<!-- TRANSACTION MODAL -->
<div class="modal-backdrop hidden" id="modalBackdrop">

  <section class="modal">

    <div class="modal-head">

      <h2 id="modalTitle">
        Thêm giao dịch
      </h2>

      <button class="close" id="closeModal">
        ×
      </button>

    </div>


    <!-- TRANSACTION TYPE -->
    <div class="segmented">

      <button
        class="seg active"
        data-type="expense">
        Chi
      </button>

      <button
        class="seg"
        data-type="income">
        Thu
      </button>

      <button
        class="seg"
        data-type="transfer">
        Chuyển
      </button>

    </div>


    <!-- FORM -->
    <form id="transactionForm">

      <label>
        Số tiền

        <input
          id="amount"
          type="number"
          min="0"
          step="1000"
          placeholder="0"
          required>
      </label>


      <div class="form-grid">

        <label>
          Danh mục

          <select id="category">

            <option>Ăn uống</option>
            <option>Di chuyển</option>
            <option>Mua sắm</option>
            <option>Sức khỏe</option>
            <option>Hóa đơn</option>
            <option>Giải trí</option>
            <option>Khác</option>

          </select>

        </label>


        <label>
          Tài khoản

          <select id="account"></select>

        </label>

      </div>


      <label>
        Ngày

        <input
          id="date"
          type="date">
      </label>


      <label>
        Ghi chú

        <input
          id="note"
          type="text"
          placeholder="Ví dụ: Cơm trưa">
      </label>


      <label class="photo-label">

        Ảnh giao dịch

        <input
          id="photo"
          type="file"
          accept="image/*"
          capture="environment">

      </label>


      <div
        id="photoPreview"
        class="photo-preview hidden">
      </div>


      <button
        class="primary full"
        type="submit">

        Lưu giao dịch

      </button>

    </form>

  </section>

</div>


<!-- TOAST -->
<div
  class="toast"
  id="toast">
</div>


<script src="app.js"></script>

</body>
</html>
