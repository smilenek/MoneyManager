name: CapMoney
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  CapMoney:
    type: application
    platform: iOS
    sources:
      - CapMoneyApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.capmoney
    info:
      path: generated/App-Info.plist
      properties:
        CFBundleDisplayName: CapMoney
        UILaunchScreen: {}
        NSCameraUsageDescription: Quay video đính kèm giao dịch.
        NSLocationWhenInUseUsageDescription: Gắn vị trí vào giao dịch khi bạn yêu cầu.
    entitlements:
      path: generated/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.capmoney]
    dependencies:
      - target: CapMoneyWidget
  CapMoneyWidget:
    type: app-extension
    platform: iOS
    sources:
      - CapMoneyWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.capmoney.widget
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: generated/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.capmoney]
